<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Vivek Kumthe Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>ADMIN <span>LOGIN</span></h1>
            <p class="subtitle">Vivek Kumthe Photography</p>

            <div class="error-msg" id="error-msg"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="username" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-full" id="login-btn">Sign In</button>
            </form>

            <a href="../index.html" class="back-link">← Back to website</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/media-service.js"></script>
    <script>
        (async function () {
            const form = document.getElementById('login-form');
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');

            if (!window.PortfolioDB?.isConfigured()) {
                errorMsg.textContent = 'Supabase is not configured. Copy config.example.js to config.js and add your credentials. See SETUP.md.';
                errorMsg.classList.add('show');
                loginBtn.disabled = true;
                return;
            }

            // Always clear any persisted session so /admin/ requires manual login
            try {
                await MediaService.signOut();
            } catch (_) { /* no active session to clear */ }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.classList.remove('show');
                loginBtn.disabled = true;
                loginBtn.textContent = 'Signing in...';

                try {
                    await MediaService.signIn(
                        document.getElementById('email').value.trim(),
                        document.getElementById('password').value
                    );
                    window.location.href = 'dashboard.html';
                } catch (err) {
                    errorMsg.textContent = err.message || 'Login failed. Check your credentials.';
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            });
        })();
    </script>
</body>
</html>
